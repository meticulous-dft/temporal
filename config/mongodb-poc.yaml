# enable-template
log:
  stdout: true
  level: info

persistence:
  defaultStore: mongodb
  visibilityStore: mongodb
  numHistoryShards: {{ default "32" (env "NUM_HISTORY_SHARDS") }}
  datastores:
    mongodb:
      mongodb:
        uri: {{ env "MONGODB_URI" | quote }}
        user: {{ env "MONGODB_USER" | quote }}
        password: {{ env "MONGODB_PASSWORD" | quote }}
        authSource: {{ default "admin" (env "MONGODB_AUTH_SOURCE") | quote }}
        databaseName: {{ env "MONGODB_DATABASE" | quote }}
        maxConns: 50
        readPreference: primary
        writeConcern: majority
        tls:
          enabled: {{ default "true" (env "MONGODB_TLS") }}
          enableHostVerification: true

global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: {{ env "TEMPORAL_BROADCAST_ADDRESS" | quote }}

services:
  frontend:
    rpc:
      grpcPort: 7233
      membershipPort: 6933
      bindOnIP: {{ default "127.0.0.1" (env "BIND_ON_IP") | quote }}
      httpPort: 7243
  matching:
    rpc:
      grpcPort: 7235
      membershipPort: 6935
      bindOnIP: {{ default "127.0.0.1" (env "BIND_ON_IP") | quote }}
  history:
    rpc:
      grpcPort: 7234
      membershipPort: 6934
      bindOnIP: {{ default "127.0.0.1" (env "BIND_ON_IP") | quote }}
  worker:
    rpc:
      grpcPort: 7239
      membershipPort: 6939
      bindOnIP: {{ default "127.0.0.1" (env "BIND_ON_IP") | quote }}

clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: active
  currentClusterName: active
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: frontend
      rpcAddress: "127.0.0.1:7233"
      httpAddress: "127.0.0.1:7243"

dcRedirectionPolicy:
  policy: noop

dynamicConfigClient:
  filepath: {{ default "/etc/temporal/dynamicconfig.yaml" (env "DYNAMIC_CONFIG_FILE_PATH") | quote }}
  pollInterval: 60s
